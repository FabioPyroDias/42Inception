server {
    # Define port to listen
    # HTTPS is port 443
    # Sets SSL module
    # This format uses the IPv4 protocol
    listen 443 ssl;
    # This uses the IPv6 protocol.
    listen [::]:443 ssl;

    # Define the domain name
    # Uses the environment variable injected by Docker at runtime
    # This will be replaced in nginx_start.sh
    server_name $DOMAIN_NAME;

    # Sets the directory where the website files are stored.
    # By default, the directory for hosting websites is on that path.
    # Since WordPress will exist in a different container, this
    #   directory will be shared between both containers through
    #   a Docker Volume.
    root /var/www/html/;

    # Sets the default file to be opened when the user requests a directory instead of a file.
    # If more than one parameter is passed, it moves to the next one in case the previous one isn't found.
    # Standard NGINX configuration sets the list as "index.php index.html index.htm".
    index index.php index.html index.htm;

    # Strictly enforce TLSv1.2 and TLSv1.3 protocols
    # Required by the subject
    ssl_protocols TLSv1.2 TLSv1.3;

    # Path to the public SSL certificate file
    # NGNIX sends this key to the browser, allowing it to encrypt the data
    #   before sending it via the connection
    ssl_certificate /etc/nginx/ssl/inception.crt;

    # Path to the private SSL key file
    # Used to decrypt the received data previously encripted by the public key
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Both of these keys are placed in /etc because /etc is the directory
    #   where all the configurations of the OS are stored.
    # By creating /nginx inside of it, a specific place for everything related
    #   to NGINX configuration now exists.
    # Anoter subfolder, ssl, is added since these are SSL Certificates and
    #   can be grouped together for easy access.

    # Route all standard requests and handle clean URLs
    # Essential for WordPress dynamic links to work without 404 errors
    location / {
        # Check if the requested file or folder exists physically
        # If not, redirect the request to index.php with the original arguments
        try_files $uri $uri/ /index.php?$args;
    }

    # Filter requests so only PHP files are sent to WordPress
    # Identifies all files ending with ".php" and redirects them to wordpress service
    location ~ \.php$
    {
        # Include standard FastCGI configuration parameters
        # Essential for PHP-FPM to understand NGINX's requests
        # This converts NGINX data into variables that PHP understands
        include snippets/fastcgi-php.conf;

        # Send requests to the 'wordpress' container from port 9000
        # This also required by the subject
        fastcgi_pass wordpress:9000;
    }
}